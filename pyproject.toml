[project]
name = "plane_pages_mcp"
version = "0.1.0"
description = "MCP server exposing read/write access to Plane CE Pages (absent from CE's public REST API)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the current 3.x line: recent releases hardened the OAuth-proxy
    # consent/redirect/cache machinery this server depends on. <4 avoids the
    # 4.0 pre-release.
    "fastmcp>=3.4.4,<4",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "uvicorn>=0.30",
    # OAuth client storage: encrypted-at-rest Redis backend for FastMCP.
    "py-key-value-aio[redis]>=0.4",
    # Asking Plane's live server whether a page is open (presence.py). Also
    # pulled in by the line above; listed because we import it directly.
    "redis>=5",
    # Yjs (Rust "yrs" bindings): page updates continue the page's existing
    # Yjs history (yjs_state.py). 0.x API, so held to the tested minor.
    "pycrdt>=0.14,<0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only for the editor harness in tests/e2e (needs a running Plane).
e2e = ["pytest>=8.0", "playwright>=1.50"]

[project.scripts]
plane-pages-mcp = "plane_pages_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_pages_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
