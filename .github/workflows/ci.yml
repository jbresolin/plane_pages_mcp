# Tests on every pull request and every push to master.
# On a version tag (v1.2.3) it also builds the Docker image and pushes it to
# Docker Hub as jbresolin/plane_pages_mcp:v1.2.3 and :latest. That only
# happens after the tests pass AND the tag equals "v" + pyproject.toml's
# version.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with
#   read/write on jbresolin/plane_pages_mcp).
# How to release: README.md, "Making a release".

name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: jbresolin/plane_pages_mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      # The editor harness in tests/e2e needs a running Plane and skips
      # itself unless PLANE_E2E=1, so this runs the unit tests only.
      - name: Unit tests
        run: pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stops the release here, before anything is built or pushed.
      - name: Tag must match pyproject.toml version
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"

      - name: Work out version
        id: version
        # v0.3.0 -> 0.3.0 (the label holds the package version; the image
        # tag keeps the "v", like every earlier release).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      # Before pushing, prove the image is what its tag says: the code
      # inside reports the version, and both labels are stamped.
      - name: Smoke-test image
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          reported=$(docker run --rm --entrypoint python "$IMAGE:$TAG" -c "import plane_pages_mcp; print(plane_pages_mcp.__version__)")
          test "$reported" = "$VERSION" || { echo "image reports version $reported, expected $VERSION"; exit 1; }
          label_version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:$TAG")
          label_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$TAG")
          test "$label_version" = "$VERSION" || { echo "version label is $label_version"; exit 1; }
          test "$label_revision" = "$REVISION" || { echo "revision label is $label_revision"; exit 1; }
          echo "image $IMAGE:$TAG reports $reported, revision $label_revision"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
